<style>html,body{background:#080707}html[data-theme="light"],html[data-theme="light"] body{background:#faf6ee}</style>
<script>(function(){try{var s=localStorage.getItem('jm:theme');var t=s==='light'||s==='dark'?s:(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.dataset.theme=t;document.querySelector('meta[name=theme-color]').setAttribute('content',t==='light'?'#faf6ee':'#080707');}catch(e){document.documentElement.dataset.theme='dark';}})();</script></head>
